<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="sdpi.css" />
		<script src="sdpi.js"></script>
	</head>
	<body>
		<div class="item">
			<label for="step">Step</label>
			<div class="control">
				<input id="step" type="range" min="1" max="25" step="1" value="5" data-setting="step" />
				<output data-output="step">5</output>
			</div>
		</div>

		<p class="hint">How much the volume moves per click of the dial.</p>
	</body>
</html>
